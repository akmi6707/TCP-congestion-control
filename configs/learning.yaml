# Learning-controller parameters (pre-registered; shared by all variants).
dt_ms: 5.0
interval_ticks: 5          # 25 ms control interval
cwnd_min: 1.0
cwnd_max: 4096.0
actions:
  - {type: mult, factor: 0.5}
  - {type: mult, factor: 0.8}
  - {type: mult, factor: 1.0}
  - {type: mult, factor: 1.02}
  - {type: mult, factor: 1.1}
  - {type: mult, factor: 1.3}
  - {type: set_bdp, factor: 1.0}
  - {type: set_bdp, factor: 1.5}
bootstrap:
  add_pkts: 2.0            # per control interval until features are valid
  loss_backoff: 0.7

reward_weights:            # pre-registered; ablations override these
  w_goodput: 1.0
  w_queue_delay: 0.5
  w_loss: 1.0
  w_action: 0.05

dqn:
  hidden: 128
  lr: 0.0007               # lowered from 0.001 after observed Q-collapse
  gamma: 0.99
  n_step: 3                # ~one RTT of credit alignment at 25 ms steps
  batch: 128
  buffer_size: 300000
  train_every: 2           # one gradient step per 2 env steps
  target_sync_steps: 500   # faster target tracking (stabilizer)
  warmup_steps: 2000
  grad_clip: 10.0
